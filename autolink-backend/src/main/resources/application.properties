spring.application.name=autolink-backend
server.port=8082

spring.datasource.url=jdbc:mariadb://localhost:3307/autolink?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

logging.level.org.springframework.security.web.*=debug

jwt.secret=${JWT_SECRET}
jwt.access.expires=3600000
jwt.refresh.expires=604800000
jwt.issuer=daw-task

# api imgBB
imgbb.api.key=${IMGBB_API_KEY}
# tamano maximo archivos subidos
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=20MB

# Configuracion de servidor de correos
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Email donde llegaran las dudas de los clientes
app.admin.email=${ADMIN_EMAIL}
