services:
  # SERVICIO DE BASE DE DATOS (MariaDB)
  db:
    image: speicon1911/autolink-tfg:mariadb
    container_name: autolink-db
    restart: always
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
    volumes:
      - mariadb_data:/var/lib/mysql

  # SERVICIO DE ADMINISTRACIÓN (phpMyAdmin)
  phpmyadmin:
    image: speicon1911/autolink-tfg:phpmyadmin
    container_name: autolink-pma
    restart: always
    ports:
      - "8080:80"
    environment:
      - PMA_HOST=db
      - PMA_PORT=3306
    depends_on:
      - db

  # SERVICIO BACKEND (Imágenes de Docker Hub)
  backend:
    image: speicon1911/autolink-tfg:backend
    container_name: autolink-backend
    restart: always
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mariadb://db:3306/${MYSQL_DATABASE}?createDatabaseIfNotExist=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - IMGBB_API_KEY=${IMGBB_API_KEY}
      - IMGBB_API_URL=${IMGBB_API_URL}
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - CORS_ALLOWED_ORIGIN=${CORS_ALLOWED_ORIGIN}
    depends_on:
      - db

  # SERVICIO FRONTEND (Imágenes de Docker Hub)
  frontend:
    image: speicon1911/autolink-tfg:frontend
    container_name: autolink-frontend
    restart: always
    ports:
      - "4200:4000"
    environment:
      - PORT=4000
    depends_on:
      - backend

volumes:
  mariadb_data:
